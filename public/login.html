<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erwin Login</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="login">
    <main class="card login-card">
      <h1 class="title-inline" title="Quail-approved access only">Welcome to Erwin <span aria-hidden="true">🪶</span></h1>
      <p class="notice">Erwin now supports Twitch-only authentication.</p>
      <div class="actions" style="margin-top: 12px;">
        <a href="/auth/twitch" class="twitch-button"><span aria-hidden="true">💜</span> Login with Twitch</a>
      </div>
      <p id="login-error" class="notice" style="color: #fca5a5; display: none; margin-top: 12px;"></p>
    </main>
      <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("error");
      if (code) {
        const el = document.getElementById("login-error");
        const map = {
          invalid_oauth_state: "OAuth session expired or invalid. Please try logging in again.",
          missing_oauth_code: "Missing OAuth code from Twitch. Please try again.",
          twitch_login_failed: "Twitch login failed. Check redirect URI/client settings and try again.",
          token_exchange_failed: "Token exchange failed. Verify TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET and exact callback URL in Twitch app settings.",
          twitch_user_fetch_failed: "Twitch user lookup failed after login. Check TWITCH_CLIENT_ID consistency and retry.",
          channel_scope_missing: "Missing required scopes. Reconnect channel with requested scopes.",
          db_schema_compat_error: "Database schema compatibility issue detected. Restart with latest migration/runtime patch and try again."
        };
        el.textContent = map[code] || "Login failed. Please try again.";
        el.style.display = "block";
      }
    </script>
  </body>
</html>
