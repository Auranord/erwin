<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erwin Login</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="login">
    <main class="card login-card">
      <h1 class="title-inline">Welcome to Erwin <span aria-hidden="true">🪶</span></h1>
      <p class="notice">Sign in with Twitch to access the dashboard.</p>
      <a class="twitch-login-button" href="/auth/twitch" aria-label="Login with Twitch">
        <span class="twitch-icon" aria-hidden="true">🟪</span>
        <span>Login with Twitch</span>
      </a>
      <p id="login-error" class="notice login-error hidden"></p>
    </main>
    <script>
      const ERROR_MESSAGES = {
        invalid_oauth_state: "Your Twitch login state was invalid or expired. Please try again.",
        missing_oauth_code: "Twitch did not return an auth code. Please try again.",
        token_exchange_failed: "We could not complete Twitch token exchange.",
        twitch_user_fetch_failed: "We could not read your Twitch user profile.",
        channel_scope_missing: "Channel connection needs additional Twitch scopes.",
        db_schema_compat_error: "Database schema is not ready for Twitch users.",
        twitch_login_failed: "Twitch login failed. Please try again."
      };
      const errorEl = document.getElementById("login-error");
      const params = new URLSearchParams(window.location.search);
      const errorCode = params.get("error");
      if (errorCode) {
        errorEl.textContent = ERROR_MESSAGES[errorCode] || ERROR_MESSAGES.twitch_login_failed;
        errorEl.classList.remove("hidden");
      }
    </script>
  </body>
</html>
