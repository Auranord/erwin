<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erwin Overlay Canvas</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      #overlay-canvas {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        max-width: 1920px;
        max-height: 1080px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="overlay-canvas" width="1920" height="1080" aria-label="Erwin stream overlay canvas"></canvas>
    <script>
      const canvas = document.getElementById("overlay-canvas");
      const ctx = canvas.getContext("2d");
      const overlayState = {
        activeUntil: 0,
        hypeUntil: 0,
        playback: {
          trackId: null,
          durationSec: 0,
          startedAtMs: 0,
          paused: true,
          pausedAtMs: 0
        }
      };
      const searchParams = new URLSearchParams(window.location.search);

      const SIDE_EQUALIZER_WIDTH = 360;
      const EQUALIZER_BANDS = 16;
      const equalizerEnergy = Array.from({ length: EQUALIZER_BANDS }, () => 0.08);
      const analyserState = {
        audio: new Audio(),
        context: null,
        analyser: null,
        gain: null,
        source: null,
        frequencyData: null,
        currentTrackId: null
      };

      analyserState.audio.preload = "auto";
      analyserState.audio.volume = 0;
      analyserState.audio.muted = true;
      analyserState.audio.playsInline = true;
      analyserState.audio.crossOrigin = "anonymous";

      function computePlaybackSeconds(nowMs) {
        const playback = overlayState.playback || {};
        const startedAtMs = Number(playback.startedAtMs || 0);
        if (!startedAtMs) return 0;
        const paused = Boolean(playback.paused);
        const pausedAtMs = Number(playback.pausedAtMs || 0);
        const durationSec = Number(playback.durationSec || 0);
        const referenceMs = paused && pausedAtMs ? pausedAtMs : nowMs;
        const elapsedSec = Math.max(0, (referenceMs - startedAtMs) / 1000);
        if (!durationSec) return elapsedSec;
        return Math.min(durationSec, elapsedSec);
      }

      function ensureAnalyser() {
        if (analyserState.analyser) return true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        analyserState.context = new AudioCtx();
        analyserState.analyser = analyserState.context.createAnalyser();
        analyserState.analyser.fftSize = 2048;
        analyserState.analyser.smoothingTimeConstant = 0.78;
        analyserState.frequencyData = new Uint8Array(analyserState.analyser.frequencyBinCount);
        analyserState.gain = analyserState.context.createGain();
        analyserState.gain.gain.value = 0;
        analyserState.source = analyserState.context.createMediaElementSource(analyserState.audio);
        analyserState.source.connect(analyserState.analyser);
        analyserState.analyser.connect(analyserState.gain);
        analyserState.gain.connect(analyserState.context.destination);
        return true;
      }

      async function syncAnalyserTrack() {
        const trackId = overlayState.playback.trackId;
        const startedAtMs = Number(overlayState.playback.startedAtMs || 0);
        if (!trackId || !startedAtMs) {
          analyserState.audio.pause();
          analyserState.audio.removeAttribute("src");
          analyserState.currentTrackId = null;
          return;
        }
        if (!ensureAnalyser()) return;
        if (analyserState.context?.state === "suspended") {
          try { await analyserState.context.resume(); } catch {}
        }

        if (analyserState.currentTrackId !== trackId) {
          analyserState.currentTrackId = trackId;
          for (let i = 0; i < EQUALIZER_BANDS; i += 1) equalizerEnergy[i] = 0.08;
          analyserState.audio.src = `/api/overlay/audio/${trackId}?v=${startedAtMs}`;
          analyserState.audio.load();
        }

        const targetSec = computePlaybackSeconds(Date.now());
        if (Number.isFinite(analyserState.audio.currentTime) && Math.abs(analyserState.audio.currentTime - targetSec) > 0.45) {
          try {
            analyserState.audio.currentTime = Math.max(0, targetSec);
          } catch {
            // Ignore seek errors while not ready.
          }
        }

        if (overlayState.playback.paused) {
          analyserState.audio.pause();
        } else {
          try {
            await analyserState.audio.play();
          } catch {
            // Ignore autoplay restrictions/transient play errors.
          }
        }
      }

      function updateEqualizerBandsFromAudio() {
        if (!analyserState.analyser || !analyserState.frequencyData || overlayState.playback.paused) {
          for (let i = 0; i < EQUALIZER_BANDS; i += 1) {
            equalizerEnergy[i] += (0.04 - equalizerEnergy[i]) * 0.06;
          }
          return;
        }

        analyserState.analyser.getByteFrequencyData(analyserState.frequencyData);
        const nyquistBins = analyserState.frequencyData.length;
        const minBin = 1;
        for (let band = 0; band < EQUALIZER_BANDS; band += 1) {
          const start = Math.floor((band / EQUALIZER_BANDS) * nyquistBins);
          const end = Math.max(start + 1, Math.floor(((band + 1) / EQUALIZER_BANDS) * nyquistBins));
          let sum = 0;
          let count = 0;
          for (let i = Math.max(minBin, start); i < end; i += 1) {
            sum += analyserState.frequencyData[i];
            count += 1;
          }
          const average = count > 0 ? sum / count : 0;
          const normalized = Math.max(0, Math.min(1, average / 255));
          const eased = normalized ** 0.85;
          equalizerEnergy[band] += (eased - equalizerEnergy[band]) * 0.22;
        }
      }

      function drawHypeEqualizerSide() {
        const playbackSec = computePlaybackSeconds(Date.now());
        const x = 0;
        const barGap = 8;
        const totalGap = barGap * (EQUALIZER_BANDS - 1);
        const barHeight = (canvas.height - totalGap) / EQUALIZER_BANDS;

        ctx.save();
        ctx.beginPath();
        ctx.rect(x, 0, SIDE_EQUALIZER_WIDTH, canvas.height);
        ctx.clip();
        ctx.transform(1, -0.12, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.48;

        const drift = (playbackSec * 14) % 360;
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, `hsla(${(drift + 0) % 360}, 95%, 62%, 0.88)`);
        gradient.addColorStop(0.34, `hsla(${(drift + 120) % 360}, 95%, 60%, 0.88)`);
        gradient.addColorStop(0.67, `hsla(${(drift + 240) % 360}, 95%, 58%, 0.88)`);
        gradient.addColorStop(1, `hsla(${(drift + 320) % 360}, 95%, 62%, 0.88)`);
        ctx.fillStyle = gradient;

        for (let i = 0; i < EQUALIZER_BANDS; i += 1) {
          const energy = equalizerEnergy[i];
          const y = i * (barHeight + barGap);
          const h = Math.max(4, barHeight);
          const w = Math.max(12, energy * (SIDE_EQUALIZER_WIDTH - 16));
          ctx.fillRect(x + 4, y, w, h);
        }

        ctx.restore();
      }

      function drawTestPulse(timestamp) {
        const elapsed = timestamp / 1000;
        const glow = 0.35 + Math.sin(elapsed * 4) * 0.18;
        ctx.save();
        ctx.globalAlpha = 0.5;
        const gradient = ctx.createRadialGradient(960, 540, 80, 960, 540, 620);
        gradient.addColorStop(0, `rgba(143, 227, 255, ${0.5 + glow})`);
        gradient.addColorStop(1, "rgba(143, 227, 255, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function drawHypeRave() {
        updateEqualizerBandsFromAudio();
        drawHypeEqualizerSide();
      }

      function drawFrame(timestamp) {
        const now = Date.now();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (overlayState.activeUntil > now) {
          drawTestPulse(timestamp);
        }
        if (overlayState.hypeUntil > now) {
          drawHypeRave();
        }

        window.requestAnimationFrame(drawFrame);
      }

      async function fetchState() {
        try {
          const response = await fetch("/api/overlay/state", { cache: "no-store" });
          if (!response.ok) return;
          const payload = await response.json();
          overlayState.activeUntil = Number(payload.activeUntil || 0);
          overlayState.hypeUntil = Number(payload.hypeUntil || 0);
          overlayState.playback.trackId = payload.playback?.trackId || null;
          overlayState.playback.durationSec = Number(payload.playback?.durationSec || 0);
          overlayState.playback.startedAtMs = Number(payload.playback?.startedAtMs || 0);
          overlayState.playback.paused = Boolean(payload.playback?.paused);
          overlayState.playback.pausedAtMs = Number(payload.playback?.pausedAtMs || 0);
          await syncAnalyserTrack();
        } catch {
          // Ignore transient connection failures.
        }
      }

      if (searchParams.get("demo") === "1") {
        const now = Date.now();
        overlayState.activeUntil = now + 8000;
        overlayState.hypeUntil = now + 10000;
      }

      setInterval(fetchState, 500);
      fetchState();
      window.requestAnimationFrame(drawFrame);
    </script>
  </body>
</html>
