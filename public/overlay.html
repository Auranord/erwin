<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erwin Overlay Canvas</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      #overlay-canvas {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        max-width: 1920px;
        max-height: 1080px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="overlay-canvas" width="1920" height="1080" aria-label="Erwin stream overlay canvas"></canvas>
    <script>
      const canvas = document.getElementById("overlay-canvas");
      const ctx = canvas.getContext("2d");
      const searchParams = new URLSearchParams(window.location.search);

      const SIDE_WIDTH = 360;
      const BAR_COUNT = 16;
      const SEGMENT_COUNT = 6;
      const BAR_GAP = 10;
      const SEGMENT_GAP = 5;

      const overlayState = {
        activeUntil: 0,
        hypeUntil: 0,
        playback: {
          trackId: null,
          durationSec: 0,
          startedAtMs: 0,
          paused: true,
          pausedAtMs: 0
        }
      };

      const analyserState = {
        audio: new Audio(),
        context: null,
        analyser: null,
        source: null,
        gain: null,
        frequencyData: null,
        currentTrackId: null,
        currentTrackStartedAtMs: 0,
        bandRanges: []
      };

      const signalState = {
        rawBands: Array.from({ length: BAR_COUNT }, () => 0),
        smoothedBands: Array.from({ length: BAR_COUNT }, () => 0.06),
        shapedBands: Array.from({ length: BAR_COUNT }, () => 0.06),
        prevBands: Array.from({ length: BAR_COUNT }, () => 0.06),
        barMotionEma: Array.from({ length: BAR_COUNT }, () => 0),
        barStale: Array.from({ length: BAR_COUNT }, () => 0),
        segmentFill: Array.from({ length: BAR_COUNT }, () => Array.from({ length: SEGMENT_COUNT }, () => 0)),
        adaptiveGain: 1.2,
        loudnessEma: 0.12,
        pulse: 0.14
      };

      analyserState.audio.preload = "auto";
      analyserState.audio.volume = 1;
      analyserState.audio.muted = false;
      analyserState.audio.crossOrigin = "anonymous";
      analyserState.audio.playsInline = true;

      function computePlaybackSeconds(nowMs) {
        const playback = overlayState.playback || {};
        const startedAtMs = Number(playback.startedAtMs || 0);
        if (!startedAtMs) return 0;
        const paused = Boolean(playback.paused);
        const pausedAtMs = Number(playback.pausedAtMs || 0);
        const durationSec = Number(playback.durationSec || 0);
        const referenceMs = paused && pausedAtMs ? pausedAtMs : nowMs;
        const elapsedSec = Math.max(0, (referenceMs - startedAtMs) / 1000);
        if (!durationSec) return elapsedSec;
        return Math.min(durationSec, elapsedSec);
      }

      function createMusicalBandRanges(binCount, sampleRate) {
        const rangesHz = [
          [35, 55], [55, 80], [80, 115], [115, 165],
          [165, 240], [240, 340], [340, 480], [480, 680],
          [680, 950], [950, 1300], [1300, 1800], [1800, 2500],
          [2500, 3500], [3500, 5000], [5000, 8000], [8000, 12500]
        ];
        const nyquist = sampleRate / 2;
        return rangesHz.map(([low, high]) => {
          const safeLow = Math.max(20, Math.min(low, nyquist - 10));
          const safeHigh = Math.max(safeLow + 20, Math.min(high, nyquist));
          const start = Math.max(1, Math.floor((safeLow / nyquist) * (binCount - 1)));
          const end = Math.max(start + 1, Math.floor((safeHigh / nyquist) * (binCount - 1)));
          return { start, end };
        });
      }

      function ensureAnalyser() {
        if (analyserState.analyser) return true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;

        analyserState.context = new AudioCtx();
        analyserState.analyser = analyserState.context.createAnalyser();
        analyserState.analyser.fftSize = 2048;
        analyserState.analyser.smoothingTimeConstant = 0.45;
        analyserState.frequencyData = new Uint8Array(analyserState.analyser.frequencyBinCount);
        analyserState.bandRanges = createMusicalBandRanges(
          analyserState.analyser.frequencyBinCount,
          analyserState.context.sampleRate || 48000
        );

        analyserState.source = analyserState.context.createMediaElementSource(analyserState.audio);
        analyserState.gain = analyserState.context.createGain();
        analyserState.gain.gain.value = 0;
        analyserState.source.connect(analyserState.analyser);
        analyserState.analyser.connect(analyserState.gain);
        analyserState.gain.connect(analyserState.context.destination);
        return true;
      }

      async function syncAnalyserTrack() {
        const trackId = overlayState.playback.trackId;
        const startedAtMs = Number(overlayState.playback.startedAtMs || 0);
        if (!trackId || !startedAtMs) {
          analyserState.audio.pause();
          analyserState.audio.removeAttribute("src");
          analyserState.currentTrackId = null;
          analyserState.currentTrackStartedAtMs = 0;
          return;
        }

        if (!ensureAnalyser()) return;
        if (analyserState.context?.state === "suspended") {
          try { await analyserState.context.resume(); } catch {}
        }

        const needsReload = (
          analyserState.currentTrackId !== trackId ||
          analyserState.currentTrackStartedAtMs !== startedAtMs ||
          analyserState.audio.error ||
          !analyserState.audio.src
        );

        if (needsReload) {
          analyserState.currentTrackId = trackId;
          analyserState.currentTrackStartedAtMs = startedAtMs;
          signalState.barStale.fill(0);
          signalState.barMotionEma.fill(0);
          analyserState.audio.src = `/api/overlay/audio/${trackId}?v=${startedAtMs}`;
          analyserState.audio.load();
        }

        const targetSec = computePlaybackSeconds(Date.now());
        if (Number.isFinite(analyserState.audio.currentTime) && Math.abs(analyserState.audio.currentTime - targetSec) > 0.45) {
          try { analyserState.audio.currentTime = Math.max(0, targetSec); } catch {}
        }

        if (overlayState.playback.paused) {
          analyserState.audio.pause();
          return;
        }

        try {
          await analyserState.audio.play();
        } catch {
          // Autoplay restrictions are handled by soft visual fallback.
        }
        if (analyserState.context?.state !== "running") {
          try { await analyserState.context?.resume(); } catch {}
        }
      }

      function updateBandsFromAudio() {
        const paused = overlayState.playback.paused || analyserState.audio.paused;
        const playbackSec = computePlaybackSeconds(Date.now());

        if (!analyserState.analyser || !analyserState.frequencyData || paused) {
          const shimmer = 0.035 + (Math.sin(playbackSec * 2.7) + 1) * 0.015;
          signalState.smoothedBands = signalState.smoothedBands.map((value, index) => {
            const target = shimmer + Math.sin(playbackSec * (1.8 + index * 0.07)) * 0.012;
            return value + (target - value) * 0.08;
          });
          return;
        }

        analyserState.analyser.getByteFrequencyData(analyserState.frequencyData);

        let framePeak = 0;
        let frameMean = 0;

        for (let band = 0; band < BAR_COUNT; band += 1) {
          const range = analyserState.bandRanges[band];
          let sum = 0;
          let peak = 0;
          let count = 0;
          for (let i = range.start; i < range.end; i += 1) {
            const value = analyserState.frequencyData[i];
            sum += value;
            peak = Math.max(peak, value);
            count += 1;
          }

          const avg = count ? sum / count : 0;
          const normalizedAvg = avg / 255;
          const normalizedPeak = peak / 255;

          // Art-directed blend: punch + body + slight cross-band glue.
          const glueLeft = band > 0 ? signalState.rawBands[band - 1] * 0.05 : 0;
          const blend = (normalizedPeak * 0.5) + (normalizedAvg * 0.38) + glueLeft;

          signalState.rawBands[band] = Math.max(0, Math.min(1, blend));
          frameMean += signalState.rawBands[band];
          framePeak = Math.max(framePeak, signalState.rawBands[band]);
        }

        frameMean /= BAR_COUNT;
        signalState.loudnessEma += (frameMean - signalState.loudnessEma) * 0.08;

        // Adaptive scaling so quieter songs stay lively but loud songs do not pin.
        const desiredGain = framePeak < 0.16 ? 1.38 : framePeak < 0.3 ? 1.18 : 0.98;
        signalState.adaptiveGain += (desiredGain - signalState.adaptiveGain) * 0.07;

        // Transient pulse for musical hits.
        const onset = Math.max(0, framePeak - (signalState.pulse * 0.95));
        signalState.pulse += (onset * 0.9 - signalState.pulse) * 0.18;

        for (let band = 0; band < BAR_COUNT; band += 1) {
          const own = signalState.rawBands[band] * signalState.adaptiveGain;
          const left = band > 0 ? signalState.rawBands[band - 1] * 0.08 : 0;
          const right = band < BAR_COUNT - 1 ? signalState.rawBands[band + 1] * 0.08 : 0;
          const pulseWeight = signalState.pulse * (band < 10 ? 0.07 : 0.04);

          const shaped = Math.min(1, Math.max(0, own + left + right + pulseWeight));
          signalState.shapedBands[band] = shaped;

          const current = signalState.smoothedBands[band];
          const target = shaped ** 1.12;
          const attack = 0.7;
          const release = 0.34;
          const alpha = target > current ? attack : release;
          const next = current + (target - current) * alpha;
          signalState.smoothedBands[band] = Math.max(0, Math.min(1, next));

          const previousShaped = signalState.prevBands[band];
          const delta = Math.abs(shaped - previousShaped);
          signalState.prevBands[band] = shaped;

          const motion = signalState.barMotionEma[band] + (delta - signalState.barMotionEma[band]) * 0.24;
          signalState.barMotionEma[band] = motion;

          let stale = signalState.barStale[band];
          const veryActive = shaped > 0.55 || motion > 0.03;
          const lowMotion = motion < 0.01 && shaped < 0.42;

          if (veryActive) {
            stale -= 0.12;
          } else if (lowMotion) {
            stale += 0.014;
          } else {
            stale -= 0.035;
          }

          signalState.barStale[band] = Math.max(0, Math.min(1, stale));
        }
      }

      function updateSegmentStates() {
        const thresholds = [0.1, 0.24, 0.38, 0.54, 0.72, 0.9];

        for (let bar = 0; bar < BAR_COUNT; bar += 1) {
          const barLevel = signalState.smoothedBands[bar];
          const stale = signalState.barStale[bar] || 0;
          for (let seg = 0; seg < SEGMENT_COUNT; seg += 1) {
            const current = signalState.segmentFill[bar][seg];
            const stalePenalty = stale * (0.12 - seg * 0.015);
            const effectiveLevel = Math.max(0, barLevel - Math.max(0, stalePenalty));
            const onThreshold = thresholds[seg];
            const offThreshold = Math.max(0, onThreshold - 0.05);
            const shouldBeOn = current > 0.5 ? effectiveLevel >= offThreshold : effectiveLevel >= onThreshold;
            const target = shouldBeOn ? 1 : 0;
            const alpha = target > current ? 0.72 : 0.34;
            signalState.segmentFill[bar][seg] = current + (target - current) * alpha;
          }
        }
      }

      function drawEqualizerSide({ side }) {
        const playbackSec = computePlaybackSeconds(Date.now());
        const sideX = side === "left" ? 0 : canvas.width - SIDE_WIDTH;
        const rowHeight = (canvas.height - BAR_GAP * (BAR_COUNT - 1) - 20) / BAR_COUNT;
        const segmentWidth = (SIDE_WIDTH - SEGMENT_GAP * (SEGMENT_COUNT - 1) - 16) / SEGMENT_COUNT;

        ctx.save();
        ctx.beginPath();
        ctx.rect(sideX, 0, SIDE_WIDTH, canvas.height);
        ctx.clip();
        ctx.transform(1, side === "left" ? -0.1 : 0.1, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "screen";

        const hueShift = (playbackSec * 12) % 360;
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, `hsla(${(hueShift + 0) % 360}, 96%, 66%, 1)`);
        gradient.addColorStop(0.33, `hsla(${(hueShift + 120) % 360}, 96%, 62%, 1)`);
        gradient.addColorStop(0.66, `hsla(${(hueShift + 230) % 360}, 96%, 60%, 1)`);
        gradient.addColorStop(1, `hsla(${(hueShift + 320) % 360}, 96%, 64%, 1)`);

        for (let bar = 0; bar < BAR_COUNT; bar += 1) {
          const displayBar = BAR_COUNT - 1 - bar;
          const y = 10 + bar * (rowHeight + BAR_GAP);
          let topLitSegment = -1;

          for (let seg = 0; seg < SEGMENT_COUNT; seg += 1) {
            const fill = signalState.segmentFill[displayBar][seg];
            const stepped = fill > 0.6 ? 1 : fill > 0.3 ? 0.45 : 0;
            const segIndex = side === "left" ? seg : (SEGMENT_COUNT - 1 - seg);
            const x = sideX + 8 + segIndex * (segmentWidth + SEGMENT_GAP);

            // Faint background shell keeps shape readable on stream.
            ctx.globalAlpha = 0.16;
            ctx.fillStyle = "rgba(255,255,255,0.18)";
            ctx.fillRect(x, y, segmentWidth, rowHeight);

            if (stepped > 0) {
              topLitSegment = Math.max(topLitSegment, seg);
              ctx.globalAlpha = 0.55 + stepped * 0.4;
              ctx.fillStyle = gradient;
              ctx.fillRect(x, y, segmentWidth, rowHeight);
            }
          }

          if (topLitSegment >= 0) {
            const segIndex = side === "left" ? topLitSegment : (SEGMENT_COUNT - 1 - topLitSegment);
            const x = sideX + 8 + segIndex * (segmentWidth + SEGMENT_GAP);
            ctx.globalAlpha = 0.42;
            ctx.fillStyle = "rgba(255,255,255,0.95)";
            ctx.fillRect(x, y, segmentWidth, 2.2);
          }
        }

        ctx.restore();
      }

      function drawTestPulse(timestamp) {
        const elapsed = timestamp / 1000;
        const glow = 0.35 + Math.sin(elapsed * 4) * 0.18;
        ctx.save();
        ctx.globalAlpha = 0.45;
        const gradient = ctx.createRadialGradient(960, 540, 80, 960, 540, 620);
        gradient.addColorStop(0, `rgba(143, 227, 255, ${0.5 + glow})`);
        gradient.addColorStop(1, "rgba(143, 227, 255, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function drawHypeRave() {
        updateBandsFromAudio();
        updateSegmentStates();
        drawEqualizerSide({ side: "left" });
        drawEqualizerSide({ side: "right" });
      }

      function drawFrame(timestamp) {
        const now = Date.now();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (overlayState.activeUntil > now) {
          drawTestPulse(timestamp);
        }
        if (overlayState.hypeUntil > now) {
          drawHypeRave();
        }

        window.requestAnimationFrame(drawFrame);
      }

      async function fetchState() {
        try {
          const response = await fetch("/api/overlay/state", { cache: "no-store" });
          if (!response.ok) return;
          const payload = await response.json();
          overlayState.activeUntil = Number(payload.activeUntil || 0);
          overlayState.hypeUntil = Number(payload.hypeUntil || 0);
          overlayState.playback.trackId = payload.playback?.trackId || null;
          overlayState.playback.durationSec = Number(payload.playback?.durationSec || 0);
          overlayState.playback.startedAtMs = Number(payload.playback?.startedAtMs || 0);
          overlayState.playback.paused = Boolean(payload.playback?.paused);
          overlayState.playback.pausedAtMs = Number(payload.playback?.pausedAtMs || 0);
          await syncAnalyserTrack();
        } catch {
          // Ignore transient connection failures.
        }
      }

      if (searchParams.get("demo") === "1") {
        const now = Date.now();
        overlayState.activeUntil = now + 8000;
        overlayState.hypeUntil = now + 10000;
      }

      setInterval(fetchState, 500);
      fetchState();
      window.requestAnimationFrame(drawFrame);
    </script>

  </body>
</html>
