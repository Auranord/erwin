<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erwin Stream Player</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="stream-page">
    <header>
      <h1 title="Erwin keeps the ledger tidy">Stream Player <span aria-hidden="true">🪶</span></h1>
      <p>This view is intended for OBS Browser Source (audio on).</p>
    </header>
    <main>
      <section class="card player-panel">
        <div class="player-header">
          <div>
            <h2>Now Playing</h2>
            <div id="stream-track" class="list-item">Waiting for session start...</div>
          </div>
        </div>
        <audio id="player"></audio>
        <div class="player-row">
          <input id="playback-progress" type="range" min="0" max="100" value="0" aria-label="Playback position" />
          <div class="notice" id="playback-time">0:00 / 0:00</div>
        </div>
        <div class="player-footer">
          <div class="player-actions bottom-left">
            <button id="play-toggle" class="icon-button" title="Play or pause">⯈</button>
            <button id="restart-track" class="icon-button secondary" title="Play from beginning">↺</button>
            <button id="skip-track" class="icon-button ghost" title="Skip track">⚔</button>
            <button id="mute-toggle" class="icon-button ghost" title="Mute or unmute">◌</button>
          </div>
          <div class="player-row compact">
            <span class="notice">Volume</span>
            <input id="volume-control" type="range" min="0" max="100" value="80" aria-label="Volume" />
          </div>
        </div>
        <div class="stream-score-actions">
          <span class="notice">Song score</span>
          <div class="player-actions">
            <button id="score-up" class="icon-button secondary" title="Upvote current song">＋</button>
            <button id="score-down" class="icon-button ghost" title="Downvote current song">－</button>
          </div>
        </div>
        <p class="notice">Use Control audio via OBS to isolate music audio.</p>
      </section>
    </main>
    <script src="/assets/player.js"></script>
    <script src="/assets/stream.js"></script>
  </body>
</html>
